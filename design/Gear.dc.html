<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const v = {};
const pet = s.pet || 'dragon';
v.pet_dragon = pet === 'dragon'; v.pet_not_dragon = pet !== 'dragon'; v.pick_pet_dragon = () => this.setState({ pet: 'dragon' });
v.pet_wolf = pet === 'wolf'; v.pet_not_wolf = pet !== 'wolf'; v.pick_pet_wolf = () => this.setState({ pet: 'wolf' });
v.pet_owl = pet === 'owl'; v.pet_not_owl = pet !== 'owl'; v.pick_pet_owl = () => this.setState({ pet: 'owl' });
const bow = s.bow || 'bow';
v.bow_bow = bow === 'bow'; v.bow_not_bow = bow !== 'bow'; v.pick_bow_bow = () => this.setState({ bow: 'bow' });
v.bow_xbow = bow === 'xbow'; v.bow_not_xbow = bow !== 'xbow'; v.pick_bow_xbow = () => this.setState({ bow: 'xbow' });
const sword = s.sword || 'iron';
v.sword_iron = sword === 'iron'; v.sword_not_iron = sword !== 'iron'; v.pick_sword_iron = () => this.setState({ sword: 'iron' });
return v;
}
}
