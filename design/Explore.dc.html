<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const DATA = {"camp": {"name": "Your pack's camp", "line": "Home. Get back here before night falls.", "monsters": "None"}, "aspen": {"name": "Aspen Forest", "line": "Tall white trees with gold leaves. Find wood and berries here.", "monsters": "Few"}, "peak": {"name": "Dragon Peak", "line": "The tallest mountain. Big dragons fly here.", "monsters": "Some"}, "cherry": {"name": "Cherry Blossom Valley", "line": "Pink petals fall all day. Baby dragons love to nap here.", "monsters": "Few"}, "lake": {"name": "Moon Lake", "line": "Still water that shines like the moon. Fish swim here at night.", "monsters": "Few"}, "ruins": {"name": "Ancient Ruins", "line": "Old stone walls from long ago. Look for hidden treasure.", "monsters": "Many"}, "caves": {"name": "Crystal Caves", "line": "Glowing crystals light up the dark. Bring a friend.", "monsters": "Some"}};
const s = this.state || {};
const at = s.at || 'aspen';
const v = { place: DATA[at], isCamp: at === 'camp', notCamp: at !== 'camp' };
Object.keys(DATA).forEach((k) => {
  v['on_' + k] = at === k; v['off_' + k] = at !== k;
  v['go_' + k] = () => this.setState({ at: k });
});
return v;
}
}
