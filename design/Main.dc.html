<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1280, "height": 800}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const name = s.name || '';
return {
name: name,
shownName: name || 'Name',
editing: !!s.editing,
notEditing: !s.editing,
startEdit: () => this.setState({ editing: true }),
stopEdit: () => this.setState({ editing: false }),
setName: (e) => this.setState({ name: e.target.value })
};
}
}
